<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREE GUYS SHERBROOKE - Gros burgers, Grosse saveur</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #c40000;
            --primary-dark: #8b0000;
            --secondary: #1a1a1a;
            --bg-dark: #0a0a0a;
            --bg-card: #151515;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --accent: #ffcc00;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        .brand {
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 10px;
        }

        /* Helpers */
        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .align-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .text-center {
            text-align: center;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- UI COMPONENTS --- */

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(196, 0, 0, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        /* Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pending {
            background: rgba(241, 196, 15, 0.2);
            color: var(--warning);
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.2);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        /* Inputs */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
            background: rgba(0, 0, 0, 0.5);
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            border: 2px solid white;
        }

        .brand-text {
            line-height: 1.2;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .brand-tagline {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- PAGES --- */

        /* Landing Page */
        #landing-page {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&q=80&w=1920') center/cover;
            border-radius: 0 0 50px 50px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .hero-btns {
            display: flex;
            gap: 20px;
        }

        /* Dashboard Employee Layout */
        #employee-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--bg-card);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-item {
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .sidebar-item.active {
            border-left-color: var(--primary);
            background: linear-gradient(90deg, rgba(196, 0, 0, 0.1), transparent);
        }

        .main-content {
            padding: 40px;
            background: var(--bg-dark);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            border-bottom: 4px solid var(--primary);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .menu-img {
            height: 180px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.1);
            background-size: cover;
            background-position: center;
        }

        .menu-info {
            padding: 20px;
        }

        .menu-cat {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .menu-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .menu-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* Tables */
        .table-container {
            background: var(--bg-card);
            border-radius: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:last-child td {
            border: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Auth Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 40px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.5rem;
        }

        /* Client Selection in Store Order */
        #cart-sidebar {
            background: var(--bg-card);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            height: 100vh;
            position: sticky;
            top: 0;
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
        }

        .cart-total {
            margin-top: 20px;
            border-top: 2px solid var(--primary);
            padding-top: 20px;
        }

        /* Notifications */
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
        }

        .toast {
            background: var(--bg-card);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 5px solid var(--primary);
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            #employee-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-btns {
                flex-direction: column;
            }

            .hero-btns .btn {
                width: 100%;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="notification-container"></div>

    <!-- HEADER (Visible for public and client) -->
    <header id="main-header">
        <div class="container nav-content">
            <div class="logo-container" onclick="router.navigate('landing')">
                <div class="logo-img">3G</div>
                <div class="brand-text">
                    <div class="brand-name">THREE GUYS</div>
                    <div class="brand-tagline">SHERBROOKE</div>
                </div>
            </div>
            <div id="header-auth">
                <!-- Dynamic based on login state -->
            </div>
        </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <div id="view-container">
        <!-- Views will be injected here -->
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="hidden"></div>

    <!-- JS LOGIC -->
    <script>
        // --- DATA STRUCTURES & INITIALIZATION ---
        const DEFAULT_MENU = [
            { id: 1, cat: 'BURGERS MAISON', name: 'Le Classique Québécois', price: 49.99, img: '🍔' },
            { id: 2, cat: 'BURGERS MAISON', name: 'Le Double Cabochon', price: 59.99, img: '🍔' },
            { id: 3, cat: 'BURGERS MAISON', name: 'Le BBQ du Ranch', price: 54.99, img: '🍔' },
            { id: 4, cat: 'BURGERS MAISON', name: 'Le Poulet Épicé du Nord', price: 52.99, img: '🍗' },
            { id: 5, cat: 'BURGERS MAISON', name: 'Le Triple Boss du 819', price: 69.99, img: '👑' },
            { id: 6, cat: 'COIN POULET', name: 'Burger Poulet Croustillant', price: 51.99, img: '🍗' },
            { id: 7, cat: 'COIN POULET', name: 'Filets de Poulet (6)', price: 53.99, img: '📦' },
            { id: 8, cat: 'COIN POULET', name: 'Wrap Poulet Grillé', price: 50.99, img: '🌯' },
            { id: 9, cat: 'À CÔTÉ', name: 'Petites frites', price: 24.99, img: '🍟' },
            { id: 10, cat: 'À CÔTÉ', name: 'Poutine Classique', price: 39.99, img: '🍲' },
            { id: 11, cat: 'À CÔTÉ', name: 'Poutine Viande Fumée', price: 49.99, img: '🥓' },
            { id: 12, cat: 'À CÔTÉ', name: 'Rondelles d’oignons', price: 27.99, img: '🧅' },
            { id: 13, cat: 'À BOIRE', name: 'Liqueur fontaine', price: 19.99, img: '🥤' },
            { id: 14, cat: 'À BOIRE', name: 'Slush', price: 22.99, img: '🍧' },
            { id: 15, cat: 'SUCRERIE', name: 'Brownie chaud', price: 24.99, img: '🍫' },
            { id: 16, cat: 'SUCRERIE', name: 'Churros', price: 26.99, img: '🥨' },
            { id: 17, cat: 'TRIOS', name: 'Fais-en un Trio (+49.99)', price: 49.99, img: '🍟🥤' },
            { id: 18, cat: 'TRIOS', name: 'Option poutine (+19.99)', price: 19.99, img: '🍲' },
            { id: 19, cat: 'SPÉCIAUX', name: 'Boîte des Chums', price: 149.99, img: '📦' },
            { id: 20, cat: 'SPÉCIAUX', name: 'Forfait Famille', price: 249.99, img: '👨‍👩‍👧‍👦' },
            { id: 21, cat: 'POINTS', name: 'Brownie gratuit', price: 50, isPoints: true, img: '🎁' },
            { id: 22, cat: 'POINTS', name: 'Petites frites gratuites', price: 75, isPoints: true, img: '🎁' },
            { id: 23, cat: 'POINTS', name: 'Burger Poulet gratuit', price: 100, isPoints: true, img: '🎁' },
            { id: 24, cat: 'POINTS', name: 'Burger Classique gratuit', price: 150, isPoints: true, img: '🎁' },
            { id: 25, cat: 'POINTS', name: 'Trio gratuit', price: 200, isPoints: true, img: '🎁' },
            { id: 26, cat: 'POINTS', name: 'Boîte des Chums gratuite', price: 300, isPoints: true, img: '🎁' },
        ];

        let state = {
            users: [], // clients
            members: [], // employees
            orders: [],
            menu: [...DEFAULT_MENU],
            currentUser: null, // Logged in user (client or employee)
            cart: [],
            currentView: 'landing',
            stats: { totalRevenue: 0, totalOrders: 0 }
        };

        // --- UTILS ---
        const formatCurrency = (val) => new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' }).format(val);

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function notify(msg) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function saveState() { localStorage.setItem('three_guys_rp_state', JSON.stringify(state)); }
        function loadState() {
            const saved = localStorage.getItem('three_guys_rp_state');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
            } else {
                // Initial Admin
                hashPassword('admin123').then(h => {
                    state.members.push({ username: 'admin', password: h, role: 'admin' });
                    saveState();
                });
            }
        }

        // --- AUTH LOGIC ---
        async function signup(name, email, rpAddress, password) {
            const hashed = await hashPassword(password);
            const newUser = { id: Date.now(), name, email, rpAddress, password: hashed, points: 0, totalSpent: 0, history: [], role: 'client' };
            state.users.push(newUser);
            state.currentUser = newUser;
            saveState();
            notify("Compte créé avec succès !");
            router.navigate('client-order');
        }

        async function login(usernameOrEmail, password, isEmployee = false) {
            const hashed = await hashPassword(password);
            const list = isEmployee ? state.members : state.users;
            const user = list.find(u => (isEmployee ? u.username : u.email) === usernameOrEmail && u.password === hashed);

            if (user) {
                state.currentUser = user;
                notify(`Bienvenue, ${user.name || user.username} !`);
                if (isEmployee) router.navigate('employee-dashboard');
                else router.navigate('client-order');
                return true;
            } else {
                notify("Identifiants incorrects.");
                return false;
            }
        }

        function logout() {
            state.currentUser = null;
            state.cart = [];
            router.navigate('landing');
        }

        // --- ORDER LOGIC ---
        function addToCart(item) {
            state.cart.push(item);
            notify(`${item.name} ajouté au panier.`);
            renderView();
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            renderView();
        }

        function submitOrder() {
            if (state.cart.length === 0) return notify("Le panier est vide !");

            const total = state.cart.reduce((sum, item) => sum + (item.isPoints ? 0 : item.price), 0);
            const pointsTotal = state.cart.reduce((sum, item) => sum + (item.isPoints ? item.price : 0), 0);

            if (pointsTotal > (state.currentUser.points || 0)) {
                return notify("Vous n'avez pas assez de points !");
            }

            const newOrder = {
                id: Date.now(),
                clientId: state.currentUser.id,
                clientName: state.currentUser.name,
                clientAddress: state.currentUser.rpAddress,
                items: [...state.cart],
                total: total,
                pointsCost: pointsTotal,
                status: 'EN_ATTENTE_VALIDATION',
                date: new Date().toISOString()
            };

            state.orders.push(newOrder);

            // Deduct points immediately if used
            if (pointsTotal > 0) {
                state.currentUser.points -= pointsTotal;
            }

            state.cart = [];
            saveState();
            notify("Commande envoyée ! En attente de validation.");
            router.navigate('client-confirmation');
        }

        // --- EMPLOYEE TOOLS ---
        function validateOrder(orderId, accept = true) {
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            if (accept) {
                order.status = 'PAYE';
                state.stats.totalRevenue += order.total;
                state.stats.totalOrders += 1;

                // Add points to user
                const user = state.users.find(u => u.id === order.clientId);
                if (user) {
                    user.points = (user.points || 0) + 10;
                    user.totalSpent = (user.totalSpent || 0) + order.total;
                    user.history.push(order);
                }
                notify("Commande validée ! +10 pts pour le client.");
            } else {
                const idx = state.orders.indexOf(order);
                state.orders.splice(idx, 1);
                notify("Commande refusée.");
            }
            saveState();
            renderView();
        }

        function updateOrderStatus(orderId, status) {
            const order = state.orders.find(o => o.id === orderId);
            if (order) {
                if (status === 'PAYE' && order.status !== 'PAYE') {
                    validateOrder(orderId, true);
                    return;
                }
                order.status = status;
                saveState();
                renderView();
            }
        }

        // --- ROUTING & RENDERING ---
        const router = {
            navigate: (view) => {
                state.currentView = view;
                renderView();
                window.scrollTo(0, 0);
            }
        };

        function renderView() {
            const container = document.getElementById('view-container');
            const headerAuth = document.getElementById('header-auth');
            const mainHeader = document.getElementById('main-header');

            // Header updates
            if (state.currentUser && state.currentUser.role === 'employee') {
                mainHeader.classList.add('hidden');
                headerAuth.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="logout()">Déconnexion</button>`;
            } else {
                mainHeader.classList.remove('hidden');
                switch (state.currentView) {
                    case 'landing':
                        headerAuth.innerHTML = `
                            <button class="btn btn-secondary btn-sm" onclick="showLoginModal(false)" style="margin-right:10px;">Connexion Client</button>
                            <button class="btn btn-secondary btn-sm" onclick="showLoginModal(true)">Connexion Employé</button>
                        `;
                        break;
                    case 'client-order':
                    case 'client-history':
                    case 'client-confirmation':
                        headerAuth.innerHTML = `

        function renderEmployeeMembers() {
            return `
                <div class="flex justify-between align-center" style="margin-bottom: 40px;">
                    <h1>Gestion du Personnel</h1>
                    <button class="btn btn-primary" onclick="showCreateMemberModal()">Ajouter Employé</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nom d'utilisateur</th>
                                <th>Rôle</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${state.members.map(m => `
                                <tr>
                                    <td><b>${m.username}</b></td>
                                    <td><span class="badge" style="background: rgba(255,255,255,0.1);">${m.role}</span></td>
                                    <td>
                                        ${m.username !== 'admin' ? `
                                            <button class="btn btn-danger btn-sm" onclick="deleteMember('${m.username}')">Supprimer</button>
                                        ` : '<span style="color:var(--text-muted)">Système</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // --- HANDLERS ---

        function processStoreOrder() {
            if (state.cart.length === 0) return notify("Le panier est vide !");
            const clientId = document.getElementById('store-client-id').value;
            const total = state.cart.reduce((s, i) => s + i.price, 0);

            let clientName = "Client Passage";
            let targetUser = null;

            if (clientId) {
                targetUser = state.users.find(u => u.id == clientId);
                if (targetUser) {
                    clientName = targetUser.name;
                }
            }

            const newOrder = {
                id: Date.now(),
                clientId: targetUser ? targetUser.id : null,
                clientName: clientName,
                items: [...state.cart],
                total: total,
                status: 'PAYE',
                date: new Date().toISOString()
            };

            state.orders.push(newOrder);
            state.stats.totalRevenue += total;
            state.stats.totalOrders += 1;

            // Add points if client selected
            if (targetUser) {
                targetUser.points = (targetUser.points || 0) + 10;
                targetUser.totalSpent = (targetUser.totalSpent || 0) + total;
                targetUser.history.push(newOrder);
                notify(`Paiement encaissé ! +10 pts pour ${targetUser.name}`);
            } else {
                notify("Paiement encaissé !");
            }

            state.cart = [];
            saveState();
            renderView();
        }

        function deleteOrder(id) {
            if (confirm("Supprimer cette commande ?")) {
                const o = state.orders.find(ord => ord.id === id);
                if (o && o.status === 'PAYE') {
                    state.stats.totalRevenue -= o.total;
                    state.stats.totalOrders -= 1;
                }
                state.orders = state.orders.filter(ord => ord.id !== id);
                saveState();
                renderView();
            }
        }

        function confirmResetMoney() {
            if (confirm("ATTENTION: Réinitialiser tous les revenus à 0$ ? Cette action est irréversible.")) {
                state.stats.totalRevenue = 0;
                state.stats.totalOrders = 0;
                saveState();
                renderView();
            }
        }

        function deleteMember(username) {
            if (confirm(`Supprimer l'employé ${username} ?`)) {
                state.members = state.members.filter(m => m.username !== username);
                saveState();
                renderView();
            }
        }

        // --- MODAL SYSTEM ---
        function showModal(content) {
            const m = document.getElementById('modal-container');
            m.innerHTML = `<div class="modal"><div class="modal-content">${content}</div></div>`;
            m.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function showLoginModal(isEmployee = false) {
            showModal(`
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h2 class="text-center" style="margin-bottom:30px;">${isEmployee ? 'Connexion Employé' : 'Connexion Client'}</h2>
                <form onsubmit="handleLogin(event, ${isEmployee})">
                    <div class="input-group">
                        <label>${isEmployee ? "Nom d'utilisateur" : "Adresse Email"}</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button class="btn btn-primary" style="width:100%;">Se connecter</button>
                    ${!isEmployee ? `<p class="text-center" style="margin-top:20px; color:var(--text-muted); cursor:pointer;" onclick="showSignupModal()">Pas encore de compte ? Créer un compte</p>` : ''}
                </form>
            `);
        }

        function showSignupModal() {
            showModal(`
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h2 class="text-center" style="margin-bottom:30px;">Créer un Compte Client</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label>Nom complet RP</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="input-group">
                        <label>Adresse Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="input-group">
                        <label>Adresse RP (Sherbrooke)</label>
                        <input type="text" id="signup-address" placeholder="Ex: 502 Rue de la Paix" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <button class="btn btn-primary" style="width:100%;">S'inscrire et Commander</button>
                </form>
            `);
        }

        function showCreateClientModal() {
            showModal(`
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h2 class="text-center" style="margin-bottom:30px;">Ajouter un Client</h2>
                <form onsubmit="handleCreateClient(event)">
                    <div class="input-group">
                        <label>Nom complet RP</label>
                        <input type="text" id="client-name" required>
                    </div>
                    <div class="input-group">
                        <label>Adresse Email</label>
                        <input type="email" id="client-email" required>
                    </div>
                    <div class="input-group">
                        <label>Adresse RP (Sherbrooke)</label>
                        <input type="text" id="client-address" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe temporaire</label>
                        <input type="password" id="client-password" required>
                    </div>
                    <button class="btn btn-primary" style="width:100%;">Enregistrer le client</button>
                </form>
            `);
        }

        function showCreateMemberModal() {
            showModal(`
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h2 class="text-center" style="margin-bottom:30px;">Ajouter un Employé</h2>
                <form onsubmit="handleCreateMember(event)">
                    <div class="input-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="new-member-user" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe</label>
                        <input type="password" id="new-member-pass" required>
                    </div>
                    <div class="input-group">
                        <label>Rôle</label>
                        <select id="new-member-role">
                            <option value="employé">Employé</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" style="width:100%;">Créer l'accès</button>
                </form>
            `);
        }

        async function handleLogin(e, isEmployee) {
            e.preventDefault();
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            const success = await login(u, p, isEmployee);
            if (success) closeModal();
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const addr = document.getElementById('signup-address').value;
            const pass = document.getElementById('signup-password').value;
            await signup(name, email, addr, pass);
            closeModal();
        }

        async function handleCreateClient(e) {
            e.preventDefault();
            const name = document.getElementById('client-name').value;
            const email = document.getElementById('client-email').value;
            const addr = document.getElementById('client-address').value;
            const pass = document.getElementById('client-password').value;

            const hashed = await hashPassword(pass);
            const newUser = { id: Date.now(), name, email, rpAddress: addr, password: hashed, points: 0, totalSpent: 0, history: [], role: 'client' };
            state.users.push(newUser);
            saveState();
            notify("Client enregistré avec succès !");
            closeModal();
            renderView();
        }

        async function handleCreateMember(e) {
            e.preventDefault();
            const u = document.getElementById('new-member-user').value;
            const p = document.getElementById('new-member-pass').value;
            const r = document.getElementById('new-member-role').value;
            const hashed = await hashPassword(p);
            state.members.push({ username: u, password: hashed, role: r });
            saveState();
            notify("Membre ajouté !");
            closeModal();
            renderView();
        }

        function viewClientProfile(id) {
            const user = state.users.find(u => u.id === id);
            if (!user) return;
            showModal(`
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h2 style="margin-bottom:20px;">Profil de ${user.name}</h2>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;">
                    <div>
                        <p style="color:var(--text-muted);">Points Actuels</p>
                        <b style="font-size:1.5rem; color:var(--warning);">${user.points} pts</b>
                    </div>
                    <div>
                        <p style="color:var(--text-muted);">Total Dépensé</p>
                        <b style="font-size:1.5rem;">${formatCurrency(user.totalSpent || 0)}</b>
                    </div>
                </div>
                <p><b>Adresse :</b> ${user.rpAddress}</p>
                <div style="margin-top:20px;">
                    <h4>Historique des Commandes</h4>
                    <div style="max-height:200px; overflow-y:auto; margin-top:10px; font-size:0.9rem;">
                        ${user.history.length === 0 ? 'Aucune commande.' : user.history.map(h => `
                            <div style="padding:10px; border-bottom:1px solid var(--glass);">
                                <b>#${h.id.toString().slice(-6)}</b> - ${formatCurrency(h.total)} (${new Date(h.date).toLocaleDateString()})
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="flex gap-10" style="margin-top:30px;">
                    <button class="btn btn-secondary btn-sm" onclick="adjustPoints(${user.id}, 10)">+10 pts</button>
                    <button class="btn btn-secondary btn-sm" onclick="adjustPoints(${user.id}, -10)">-10 pts</button>
                </div>
            `);
        }

        function adjustPoints(userId, amt) {
            const u = state.users.find(user => user.id === userId);
            if (u) {
                u.points = Math.max(0, u.points + amt);
                saveState();
                notify("Points mis à jour.");
                viewClientProfile(userId);
                renderView();
            }
        }

        function filterClients(val) {
            const query = val.toLowerCase();
            const rows = document.querySelectorAll('#clients-table tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        // --- INIT ---
        window.onload = () => {
            loadState();
            renderView();
        };

    </script>
</body>

</html>
